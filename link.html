<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Application Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Literata:opsz,wght@7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .builder{max-width:640px;padding-block:48px}
  .builder label{display:block;margin:18px 0 6px;font:600 .9rem var(--display)}
  .builder select{width:100%;font:400 1rem var(--body);padding:12px 14px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
  .out{margin-top:28px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .out code{display:block;font:500 .9rem/1.5 var(--mono);overflow-wrap:anywhere;user-select:all;margin:6px 0 12px}
</style>
</head>
<body>
<main>
  <section class="builder" aria-labelledby="h">
    <p class="kicker">For me only</p>
    <h2 id="h">Create an application link</h2>
    <p class="lead">The link greets the company or contact person, names the role and opens the page in the matching lens. This page is not linked anywhere and search engines ignore it.</p>
    <form id="f">
      <label for="firma">Company</label><input type="text" id="firma" placeholder="e.g. Porsche AG">
      <label for="an">Contact person</label><input type="text" id="an" placeholder="e.g. Ms. Müller">
      <label for="rolle">Role</label><input type="text" id="rolle" placeholder="e.g. Senior Cyber Security Engineer">
      <label for="fokus">Lens</label>
      <select id="fokus">
        <option value="">Full picture</option>
        <option value="sec">Cyber Security</option>
        <option value="arch">Architect</option>
        <option value="e2e">Solution manager</option>
        <option value="pm">Project lead</option>
      </select>
    </form>
    <div class="out">
      <p class="lbl">Your link</p>
      <code id="url"></code>
      <div class="row">
        <button class="btn" type="button" id="copy">Copy link</button>
        <a class="btn ghost" id="open" href="./" target="_blank" rel="noopener">Open preview</a>
      </div>
    </div>
  </section>
</main>
<script>
(() => {
  const ids = ["firma", "an", "rolle", "fokus"];
  const base = location.href.replace(/link\.html.*$/, "");
  const build = () => {
    const p = new URLSearchParams();
    ids.forEach(id => { const v = document.getElementById(id).value.trim(); if (v) p.set(id, v); });
    const url = base + (p.toString() ? "?" + p.toString() : "");
    document.getElementById("url").textContent = url;
    document.getElementById("open").href = url;
    return url;
  };
  ids.forEach(id => document.getElementById(id).addEventListener("input", build));
  document.getElementById("f").addEventListener("submit", e => e.preventDefault());
  document.getElementById("copy").addEventListener("click", e => {
    const b = e.currentTarget, url = build();
    const ok = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy link", 1500); };
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(ok).catch(() => {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("url"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    });
  });
  build();
})();
</script>
</body>
</html>
