<title>Concertino Programmheft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap">

<style>
/* Layout: sidebar-free single-column app, card-based sections, modal overlays */
:root {
  --bg: #f7f5f2;
  --bg-card: #ffffff;
  --fg: #1a1a1a;
  --fg-muted: #6b6560;
  --accent: #1a9e96;
  --accent-light: #e0f5f3;
  --accent-dark: #137a74;
  --gold: #e6a817;
  --gold-light: #fdf4dc;
  --magenta: #c4265c;
  --magenta-light: #fce8ef;
  --border: #e2ddd8;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --radius: 8px;
  --font-display: 'Crimson Pro', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161413;
    --bg-card: #221f1d;
    --fg: #e8e4e0;
    --fg-muted: #9a948e;
    --accent: #2abcb3;
    --accent-light: #1a2e2d;
    --accent-dark: #5ed6ce;
    --gold: #f0bc3a;
    --gold-light: #2a2518;
    --magenta: #e64d7a;
    --magenta-light: #2e1a20;
    --border: #3a3532;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161413;
  --bg-card: #221f1d;
  --fg: #e8e4e0;
  --fg-muted: #9a948e;
  --accent: #2abcb3;
  --accent-light: #1a2e2d;
  --accent-dark: #5ed6ce;
  --gold: #f0bc3a;
  --gold-light: #2a2518;
  --magenta: #e64d7a;
  --magenta-light: #2e1a20;
  --border: #3a3532;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  min-height: 100vh;
}

/* Utility */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* Header */
.app-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 51;
  background: var(--bg-card);
}
.app-header img { height: 36px; }
.app-header h1 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  flex: 1;
}
.app-header .user-badge {
  font-size: 12px;
  color: var(--fg-muted);
  background: var(--accent-light);
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 500;
}
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  transition: all .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--magenta); color: #fff; }
.btn-gold { background: var(--gold); color: #1a1a1a; }
.btn-gold:hover { filter: brightness(1.1); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px; background: none; border: 1px solid var(--border); border-radius: var(--radius); color: var(--fg-muted); }
.btn-icon:hover { color: var(--accent); border-color: var(--accent); }

/* Login */
.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  gap: 24px;
}
.login-card {
  background: var(--bg-card);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.login-card img { height: 56px; align-self: center; }
.login-card h2 {
  font-family: var(--font-display);
  font-size: 24px;
  color: var(--accent);
}
.login-card input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
}
.login-card input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.login-error { color: var(--magenta); font-size: 13px; display: none; }

/* Main content */
.main-content { max-width: 960px; margin: 0 auto; padding: 20px 0 40px; }

/* Tabs */
.tabs {
  display: flex;
  gap: 2px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
}
.tab {
  padding: 10px 18px;
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  cursor: pointer;
  transition: all .15s;
}
.tab:hover { color: var(--fg); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Status chips */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  text-transform: uppercase;
}
.chip-success { background: var(--accent-light); color: var(--accent); }
.chip-warning { background: var(--gold-light); color: var(--gold); }
.chip-danger { background: var(--magenta-light); color: var(--magenta); }

/* Event cards */
.event-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.event-title { font-family: var(--font-display); font-size: 26px; font-weight: 700; text-wrap: balance; }
.event-meta { color: var(--fg-muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
.event-meta span { display: inline-flex; align-items: center; gap: 4px; }

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  text-align: center;
}
.stat-number { font-family: var(--font-display); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 11px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 2px; }

/* Teacher list */
.teacher-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}
.teacher-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 10px 14px;
  box-shadow: var(--shadow);
  font-size: 13px;
  min-width: 0;
}
.teacher-row .name { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.teacher-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--accent-light);
  color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px;
  flex-shrink: 0;
}

/* Program table */
.program-section { margin-bottom: 24px; }
.program-section h3 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.program-item {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 16px;
  cursor: grab;
  transition: box-shadow .15s;
  position: relative;
}
.program-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.program-item .drag-handle {
  grid-row: 1 / 3;
  color: var(--fg-muted);
  opacity: .4;
  font-size: 16px;
  display: flex;
  align-items: center;
  padding-right: 4px;
  user-select: none;
}
.program-item .piece-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
}
.program-item .piece-detail {
  font-size: 12px;
  color: var(--fg-muted);
}
.program-item .piece-teacher {
  position: absolute;
  top: 10px;
  right: 14px;
  font-size: 11px;
  color: var(--fg-muted);
  font-weight: 500;
}

/* Teacher entry view */
.entry-section {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.entry-section h3 {
  font-family: var(--font-display);
  font-size: 18px;
  margin-bottom: 16px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.form-group input, .form-group select, .form-group textarea {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  border-color: transparent;
}
.performer-row {
  display: flex;
  gap: 8px;
  align-items: end;
}
.performer-row .form-group { flex: 1; min-width: 0; }

/* PDF Preview */
.pdf-preview-container {
  background: var(--fg-muted);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  justify-content: center;
}
.pdf-page {
  background: #ffffff;
  color: #1a1a1a;
  width: 100%;
  max-width: 595px;
  aspect-ratio: 210 / 297;
  padding: 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,.3);
  font-family: var(--font-body);
  font-size: 11px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.pdf-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 2px solid #1a9e96;
}
.pdf-header img { height: 40px; }
.pdf-event-info { text-align: right; }
.pdf-event-info .pdf-event-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 700;
  color: #1a9e96;
}
.pdf-event-info .pdf-event-date { font-size: 12px; color: #6b6560; margin-top: 2px; }
.pdf-program-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: #1a9e96;
  margin-bottom: 12px;
}
.pdf-item {
  padding: 6px 0;
  border-bottom: 1px solid #e2ddd8;
}
.pdf-item:last-child { border-bottom: none; }
.pdf-composer { font-weight: 600; font-size: 11px; }
.pdf-werk { font-style: italic; font-size: 11px; margin-left: 4px; }
.pdf-performers { font-size: 10px; color: #6b6560; margin-top: 1px; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 28px;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,.2);
}
.modal h2 {
  font-family: var(--font-display);
  font-size: 22px;
  margin-bottom: 20px;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--fg-muted);
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .4; }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--fg);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  z-index: 200;
  transition: transform .3s;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Responsive */
@media (max-width: 600px) {
  .app-header h1 { font-size: 16px; }
  .event-title { font-size: 20px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
  .teacher-grid { grid-template-columns: 1fr; }
  .program-item { grid-template-columns: 1fr; }
  .program-item .drag-handle { display: none; }
  .program-item .piece-teacher { position: static; margin-top: 4px; }
  .btn span.hide-mobile { display: none; }
}
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

let currentView = 'login';
let currentRole = null; // 'admin' or teacher name
let selectedEvent = null;
let activeTab = 'uebersicht';

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return [...document.querySelectorAll(sel)]; }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function render() {
  const app = document.getElementById('app');
  if (currentView === 'login') {
    app.innerHTML = renderLogin();
  } else if (currentView === 'admin') {
    app.innerHTML = renderAdminHeader() + '<div class="main-content">' + renderAdminContent() + '</div>';
  } else if (currentView === 'teacher') {
    app.innerHTML = renderTeacherHeader() + '<div class="main-content">' + renderTeacherContent() + '</div>';
  }
  bindEvents();
}

function renderLogin() {
  return `

        </div>
        <div class="login-error" id="loginError">Falsches Passwort. Bitte versuchen Sie es erneut.</div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">Anmelden</button>
        <p style="font-size:11px;color:var(--fg-muted)">Passwort: <code style="background:var(--accent-light);padding:2px 6px;border-radius:4px">jms2026</code> (Demo)</p>
      </div>

}

function renderAdminHeader() {
  return `
    <header class="app-header">
      <img src="${LOGO_SRC}" alt="Logo">
      <h1>Programmheft-Tool</h1>
      <div class="header-actions">
        <span class="user-badge">👤 Admin</span>

}

function renderAdminContent() {
  if (!selectedEvent) {
    return renderEventList();
  }
  return renderEventDetail();
}

function renderEventList() {
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <h2 style="font-family:var(--font-display);font-size:22px">Veranstaltungen</h2>
      <button class="btn btn-primary" id="newEventBtn">＋ Neue Veranstaltung</button>
    </div>`;

  EVENTS.forEach(ev => {
    const total = ev.teachers.length;
    const done = ev.teachers.filter(t => ev.status[t] === 'done').length;
    const pct = total ? Math.round(done / total * 100) : 0;
    const chipClass = pct === 100 ? 'chip-success' : pct > 0 ? 'chip-warning' : 'chip-danger';
    const chipLabel = pct === 100 ? 'Vollständig' : `${done}/${total} Lehrkräfte`;

    html += `
      <div class="entry-section" style="cursor:pointer" data-event-id="${ev.id}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
          <div>
            <div style="font-family:var(--font-display);font-size:20px;font-weight:700">${ev.title}</div>
            ${ev.subtitle ? `<div style="font-size:12px;color:var(--fg-muted);font-style:italic">${ev.subtitle}</div>` : ''}
          </div>
          <span class="chip ${chipClass}">${chipLabel}</span>
        </div>
        <div style="display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--fg-muted);flex-wrap:wrap">
          <span>📅 ${ev.date}</span>
          <span>🕐 ${ev.time}</span>
          <span>📍 ${ev.location}</span>
          <span>⏰ Abgabe: ${ev.deadline}</span>
        </div>
        <div style="margin-top:12px;background:var(--bg);border-radius:20px;height:6px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:20px;transition:width .3s"></div>
        </div>
      </div>`;
  });
  return html;
}

function renderEventDetail() {
  const ev = EVENTS.find(e => e.id === selectedEvent);
  if (!ev) return '';

  const total = ev.teachers.length;
  const done = ev.teachers.filter(t => ev.status[t] === 'done').length;
  const pending = total - done;

  let tabs = `
    <div class="tabs">
      <button class="tab ${activeTab === 'uebersicht' ? 'active' : ''}" data-tab="uebersicht">Übersicht</button>
      <button class="tab ${activeTab === 'programm' ? 'active' : ''}" data-tab="programm">Programm (${ev.entries.length})</button>
      <button class="tab ${activeTab === 'vorschau' ? 'active' : ''}" data-tab="vorschau">PDF-Vorschau</button>
    </div>`;

  let content = '';
  if (activeTab === 'uebersicht') {
    content = renderOverviewTab(ev, total, done, pending);
  } else if (activeTab === 'programm') {
    content = renderProgramTab(ev);
  } else if (activeTab === 'vorschau') {
    content = renderPreviewTab(ev);
  }

  return `
    <div style="margin-bottom:16px">
      <button class="btn btn-secondary btn-sm" id="backBtn">← Zurück</button>
    </div>
    <div class="event-header">
      <div>
        <div class="event-title">${ev.title}</div>
        ${ev.subtitle ? `<div style="font-size:14px;color:var(--fg-muted);font-style:italic">${ev.subtitle}</div>` : ''}
        <div class="event-meta">
          <span>📅 ${ev.date}</span>
          <span>🕐 ${ev.time}</span>
          <span>📍 ${ev.location}</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-gold btn-sm" id="remindBtn">📧 <span class="hide-mobile">Erinnerung senden</span></button>
      </div>
    </div>
    ${tabs}${content}`;
}

function renderOverviewTab(ev, total, done, pending) {
  let html = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-number" style="color:var(--accent)">${total}</div>
        <div class="stat-label">Lehrkräfte</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" style="color:var(--accent)">${done}</div>
        <div class="stat-label">Eingetragen</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" style="color:${pending ? 'var(--gold)' : 'var(--accent)'}">${pending}</div>
        <div class="stat-label">Ausstehend</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">${ev.entries.length}</div>
        <div class="stat-label">Beiträge</div>
      </div>
    </div>
    <h3 style="font-family:var(--font-display);font-size:18px;margin-bottom:12px">Lehrkräfte</h3>
    <div class="teacher-grid">`;

  ev.teachers.forEach(t => {
    const isDone = ev.status[t] === 'done';
    const count = ev.entries.filter(e => e.teacher === t).length;
    html += `
      <div class="teacher-row">
        <div class="teacher-avatar">${getInitials(t)}</div>
        <div class="name">${t}</div>
        ${count ? `<span style="font-size:11px;color:var(--fg-muted)">${count}×</span>` : ''}
        <span class="chip ${isDone ? 'chip-success' : 'chip-danger'}">${isDone ? '✓' : '⏳'}</span>
      </div>`;
  });

  html += '</div>';
  return html;
}

function renderProgramTab(ev) {
  if (ev.entries.length === 0) {
    return `
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/></svg>
        <p style="font-size:15px;font-weight:500;margin-bottom:4px">Noch keine Beiträge</p>
        <p>Sobald die Lehrkräfte ihre Stücke eintragen, erscheinen sie hier.</p>
      </div>`;
  }

  // Group by teacher
  const byTeacher = {};
  ev.entries.forEach(e => {
    if (!byTeacher[e.teacher]) byTeacher[e.teacher] = [];
    byTeacher[e.teacher].push(e);
  });

  let html = '<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">';
  html += `<button class="btn btn-secondary btn-sm group-toggle active" data-group="sequence">Reihenfolge</button>`;
  html += `<button class="btn btn-secondary btn-sm group-toggle" data-group="teacher">Nach Lehrkraft</button>`;
  html += '</div>';

  // Sequence view (default)
  html += '<div id="view-sequence">';
  ev.entries.forEach((e, i) => {
    html += renderProgramItem(e, i + 1);
  });
  html += '</div>';

  // Teacher view
  html += '<div id="view-teacher" hidden>';
  Object.keys(byTeacher).forEach(teacher => {
    html += `<div class="program-section"><h3>${teacher}</h3>`;
    byTeacher[teacher].forEach((e, i) => {
      html += renderProgramItem(e, null);
    });
    html += '</div>';
  });
  html += '</div>';

  return html;
}

function renderProgramItem(e, num) {
  const composerDisplay = e.composer || 'Trad.';
  const perfStr = e.performers.map(p => `${p.name}${p.instrument ? ', ' + p.instrument : ''}`).join(' · ');
  return `
    <div class="program-item" data-entry-id="${e.id}">
      <div class="drag-handle">⠿</div>
      <div>
        <span class="piece-title">${composerDisplay}</span>
        <span style="color:var(--fg-muted);font-size:14px;font-style:italic"> — ${e.werk}</span>
      </div>
      <div class="piece-detail">${perfStr}</div>
      ${num !== null ? '' : `<span class="piece-teacher">${e.teacher}</span>`}
      ${e.note ? `<div style="grid-column:2;font-size:11px;color:var(--gold);margin-top:2px">📝 ${e.note}</div>` : ''}
    </div>`;
}

function renderPreviewTab(ev) {
  let items = '';
  ev.entries.forEach(e => {
    const perfStr = e.performers.map(p => `${p.name}${p.instrument ? ', ' + p.instrument : ''}`).join(' · ');
    items += `
      <div class="pdf-item">
        <div><span class="pdf-composer">${e.composer || 'Trad.'}</span><span class="pdf-werk"> — ${e.werk}</span></div>
        <div class="pdf-performers">${perfStr}</div>
      </div>`;
  });

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;gap:8px">
      <button class="btn btn-primary" id="generatePdfBtn">📄 PDF erzeugen</button>
    </div>
    <div class="pdf-preview-container">
      <div class="pdf-page">
        <div class="pdf-header">
          <img src="${LOGO_SRC}" alt="Logo">
          <div class="pdf-event-info">
            <div class="pdf-event-title">${ev.title}</div>
            <div class="pdf-event-date">${ev.date} · ${ev.time}<br>${ev.location}</div>
          </div>
        </div>
        <div class="pdf-program-title">Programm</div>
        <div style="flex:1;overflow:hidden">${items || '<p style="color:#999;text-align:center;margin-top:40px">Noch keine Beiträge vorhanden.</p>'}</div>
        <div style="text-align:center;font-size:9px;color:#999;margin-top:auto;padding-top:12px;border-top:1px solid #e2ddd8">
          JugendMusikSchule Freiberg a.N. · Pleidelsheim e.V.
        </div>
      </div>
    </div>`;
}

  // Show events where this teacher is assigned
  const myEvents = EVENTS.filter(ev => ev.teachers.includes(currentRole));

  if (!selectedEvent) {
    let html = `<h2 style="font-family:var(--font-display);font-size:22px;margin-bottom:16px">Meine Veranstaltungen</h2>`;
    myEvents.forEach(ev => {
      const myStatus = ev.status[currentRole];
      const myEntries = ev.entries.filter(e => e.teacher === currentRole);
      html += `
        <div class="entry-section" style="cursor:pointer" data-event-id="${ev.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
            <div>
              <div style="font-family:var(--font-display);font-size:18px;font-weight:700">${ev.title}</div>
              <div style="font-size:13px;color:var(--fg-muted)">${ev.date} · ${ev.time}</div>
            </div>
            <span class="chip ${myStatus === 'done' ? 'chip-success' : 'chip-warning'}">${myStatus === 'done' ? '✓ Abgeschlossen' : 'Offen'}</span>
          </div>
          ${myEntries.length ? `<div style="font-size:12px;color:var(--fg-muted);margin-top:8px">${myEntries.length} Beitrag/Beiträge eingetragen</div>` : ''}
          <div style="font-size:12px;color:var(--gold);margin-top:4px">⏰ Abgabe bis ${ev.deadline}</div>
        </div>`;
    });
    return html;
  }

  const ev = EVENTS.find(e => e.id === selectedEvent);
  const myEntries = ev.entries.filter(e => e.teacher === currentRole);
  const isDone = ev.status[currentRole] === 'done';

  let html = `
    <button class="btn btn-secondary btn-sm" id="backBtn" style="margin-bottom:16px">← Zurück</button>
    <div class="event-header">
      <div>
        <div class="event-title">${ev.title}</div>
        <div class="event-meta">
          <span>📅 ${ev.date} · ${ev.time}</span>
          <span>⏰ Abgabe: ${ev.deadline}</span>
        </div>
      </div>
    </div>`;

  // Show existing entries
  if (myEntries.length) {
    html += `<h3 style="font-family:var(--font-display);font-size:18px;margin-bottom:12px">Meine Beiträge</h3>`;
    myEntries.forEach(e => {
      const perfStr = e.performers.map(p => `${p.name}${p.instrument ? ', ' + p.instrument : ''}`).join(' · ');
      html += `
        <div class="entry-section" style="padding:14px 16px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div>
              <div style="font-family:var(--font-display);font-size:16px;font-weight:600">${e.composer || 'Trad.'} — <em>${e.werk}</em></div>
              <div style="font-size:12px;color:var(--fg-muted);margin-top:2px">${perfStr}</div>
            </div>
            <button class="btn btn-icon btn-sm delete-entry" data-id="${e.id}" title="Löschen">✕</button>
          </div>
        </div>`;
    });
  }

  // Add new entry form
  html += `
    <div class="entry-section" style="margin-top:16px">
      <h3>Neuen Beitrag hinzufügen</h3>
      <div class="form-grid" id="entryForm">
        <div class="form-group">
          <label>Komponist</label>
          <input type="text" id="fComposer" placeholder="z.B. Ludwig van Beethoven (1770–1827)">
        </div>
        <div class="form-group">
          <label>Stück / Werk</label>
          <input type="text" id="fWerk" placeholder="z.B. Für Elise">
        </div>
        <div class="form-group full">
          <label>Mitwirkende</label>
          <div id="performerRows">
            <div class="performer-row" style="margin-bottom:6px">
              <div class="form-group" style="flex:2"><input type="text" class="p-name" placeholder="Name"></div>

            </div>
          </div>
          <button class="btn btn-secondary btn-sm" id="addPerfBtn" style="margin-top:4px">+ Mitwirkende/r</button>
        </div>
        <div class="form-group full">
          <label>Hinweis (optional)</label>
          <input type="text" id="fNote" placeholder="z.B. direkt nach dem vorherigen Stück">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn btn-primary" id="saveEntryBtn">Beitrag speichern</button>
      </div>

  html += `
    <div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">

      ${!isDone ? `<button class="btn btn-secondary" id="noEntryBtn">Ich habe keinen Beitrag</button>` : ''}
    </div>`;

  return html;
}

function bindEvents() {
  // Login
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) {
    const doLogin = () => {
      const pw = document.getElementById('loginPw').value;
      if (pw === PASSWORD) {
        showRolePicker();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    };
    loginBtn.addEventListener('click', doLogin);
    const pwInput = document.getElementById('loginPw');
    if (pwInput) pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }

  // Logout
  $$('#logoutBtn').forEach(btn => btn.addEventListener('click', () => {
    currentView = 'login'; currentRole = null; selectedEvent = null; activeTab = 'uebersicht';
    render();
  }));

  // Event click
  $$('[data-event-id]').forEach(el => el.addEventListener('click', () => {
    selectedEvent = parseInt(el.dataset.eventId);
    activeTab = 'uebersicht';
    render();
  }));

  // Back
  const backBtn = document.getElementById('backBtn');
  if (backBtn) backBtn.addEventListener('click', () => { selectedEvent = null; render(); });

  // Tabs
  $$('.tab').forEach(t => t.addEventListener('click', () => {
    activeTab = t.dataset.tab;
    render();
  }));

  // Group toggle
  $$('.group-toggle').forEach(btn => btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    $$('.group-toggle').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const seqView = document.getElementById('view-sequence');
    const teacherView = document.getElementById('view-teacher');
    if (seqView && teacherView) {
      seqView.hidden = group !== 'sequence';
      teacherView.hidden = group !== 'teacher';
    }
  }));

  // Add performer row
  const addPerfBtn = document.getElementById('addPerfBtn');
  if (addPerfBtn) addPerfBtn.addEventListener('click', () => {
    const container = document.getElementById('performerRows');
    const row = document.createElement('div');
    row.className = 'performer-row';
    row.style.marginBottom = '6px';
    row.innerHTML = `
      <div class="form-group" style="flex:2"><input type="text" class="p-name" placeholder="Name"></div>
      <div class="form-group" style="flex:1"><input type="text" class="p-instrument" placeholder="Instrument"></div>
      <button class="btn btn-icon btn-sm remove-perf" title="Entfernen">✕</button>`;
    container.appendChild(row);
    row.querySelector('.remove-perf').addEventListener('click', () => row.remove());
  });

  // Remove performer
  $$('.remove-perf').forEach(btn => btn.addEventListener('click', () => {
    const rows = document.getElementById('performerRows');
    if (rows && rows.children.length > 1) btn.closest('.performer-row').remove();
  }));

  // Save entry
  const saveEntryBtn = document.getElementById('saveEntryBtn');
  if (saveEntryBtn) saveEntryBtn.addEventListener('click', () => {
    const composer = document.getElementById('fComposer').value.trim();
    const werk = document.getElementById('fWerk').value.trim();
    const note = document.getElementById('fNote').value.trim();
    if (!werk) { toast('Bitte mindestens das Stück angeben.'); return; }

    const performers = [];
    $$('#performerRows .performer-row').forEach(row => {
      const name = row.querySelector('.p-name').value.trim();
      const instrument = row.querySelector('.p-instrument').value.trim();
      if (name) performers.push({ name, instrument });
    });
    if (!performers.length) { toast('Mindestens ein/e Mitwirkende/r angeben.'); return; }

    const ev = EVENTS.find(e => e.id === selectedEvent);
    ev.entries.push({
      id: Date.now(),
      teacher: currentRole,
      composer, werk, performers, note
    });
    toast('Beitrag gespeichert!');
    render();
  });

  // Mark done
  const markDoneBtn = document.getElementById('markDoneBtn');
  if (markDoneBtn) markDoneBtn.addEventListener('click', () => {
    const ev = EVENTS.find(e => e.id === selectedEvent);
    ev.status[currentRole] = 'done';
    toast('Als fertig markiert ✓');
    render();
  });

  // No entry
  const noEntryBtn = document.getElementById('noEntryBtn');
  if (noEntryBtn) noEntryBtn.addEventListener('click', () => {
    const ev = EVENTS.find(e => e.id === selectedEvent);
    ev.status[currentRole] = 'done';
    toast('Kein Beitrag — als fertig markiert ✓');
    render();
  });

  // Delete entry
  $$('.delete-entry').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = parseInt(btn.dataset.id);
    const ev = EVENTS.find(e => e.id === selectedEvent);
    ev.entries = ev.entries.filter(e => e.id !== id);
    toast('Beitrag gelöscht.');
    render();
  }));

  // Remind
  const remindBtn = document.getElementById('remindBtn');
  if (remindBtn) remindBtn.addEventListener('click', () => {
    const ev = EVENTS.find(e => e.id === selectedEvent);
    const pending = ev.teachers.filter(t => ev.status[t] !== 'done');
    if (!pending.length) { toast('Alle Lehrkräfte haben bereits eingetragen!'); return; }
    toast(`Erinnerung an ${pending.length} Lehrkraft/Lehrkräfte gesendet.`);
  });

  // Generate PDF
  const genPdfBtn = document.getElementById('generatePdfBtn');
  if (genPdfBtn) genPdfBtn.addEventListener('click', () => {
    toast('PDF wird erzeugt… (in der echten App)');
  });

  // New event
  const newEventBtn = document.getElementById('newEventBtn');
  if (newEventBtn) newEventBtn.addEventListener('click', () => showNewEventModal());
}

function showRolePicker() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay open';
  modal.innerHTML = `
    <div class="modal">
      <h2>Anmelden als…</h2>
      <p style="font-size:13px;color:var(--fg-muted);margin-bottom:16px">Wählen Sie Ihre Rolle für diese Demo.</p>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" id="pickAdmin">🔧 Admin / Schulleitung</button>
      <div style="position:relative;text-align:center;margin:12px 0;color:var(--fg-muted);font-size:12px">
        <span style="background:var(--bg-card);padding:0 12px;position:relative;z-index:1">oder als Lehrkraft</span>
        <div style="position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:240px;overflow-y:auto">
        ${TEACHERS.map(t => `<button class="btn btn-secondary btn-sm pick-teacher" data-name="${t}" style="justify-content:center">${t}</button>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closePickerBtn">Abbrechen</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  modal.querySelector('#pickAdmin').addEventListener('click', () => {
    currentView = 'admin'; currentRole = 'admin'; selectedEvent = null;
    modal.remove(); render();
  });
  modal.querySelectorAll('.pick-teacher').forEach(btn => {
    btn.addEventListener('click', () => {
      currentView = 'teacher'; currentRole = btn.dataset.name; selectedEvent = null;
      modal.remove(); render();
    });
  });
  modal.querySelector('#closePickerBtn').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
}

function showNewEventModal() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay open';
  modal.innerHTML = `
    <div class="modal">
      <h2>Neue Veranstaltung</h2>
      <div class="form-grid">
        <div class="form-group full"><label>Titel</label><input type="text" id="neTitle" placeholder="z.B. Concertino"></div>
        <div class="form-group full"><label>Untertitel (optional)</label><input type="text" id="neSubtitle" placeholder="z.B. Die kleine Konzertreihe"></div>
        <div class="form-group"><label>Datum</label><input type="date" id="neDate"></div>
        <div class="form-group"><label>Uhrzeit</label><input type="time" id="neTime" value="18:00"></div>
        <div class="form-group full"><label>Ort</label><input type="text" id="neLocation" placeholder="z.B. Prisma, Freiberg a.N."></div>
        <div class="form-group"><label>Abgabefrist</label><input type="date" id="neDeadline"></div>
        <div class="form-group full">
          <label>Lehrkräfte</label>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">
            ${TEACHERS.map(t => `<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;background:var(--bg);padding:4px 8px;border-radius:var(--radius);border:1px solid var(--border)"><input type="checkbox" class="ne-teacher" value="${t}" checked> ${t}</label>`).join('')}
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeNewEventBtn">Abbrechen</button>
        <button class="btn btn-primary" id="createEventBtn">Anlegen</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  modal.querySelector('#createEventBtn').addEventListener('click', () => {
    const title = modal.querySelector('#neTitle').value.trim();
    if (!title) { toast('Bitte Titel eingeben.'); return; }
    const d = modal.querySelector('#neDate').value;
    const date = d ? d.split('-').reverse().join('.') : '';
    const time = modal.querySelector('#neTime').value ? modal.querySelector('#neTime').value + ' Uhr' : '';
    const dl = modal.querySelector('#neDeadline').value;
    const deadline = dl ? dl.split('-').reverse().join('.') : '';
    const teachers = [...modal.querySelectorAll('.ne-teacher:checked')].map(cb => cb.value);
    const status = {};
    teachers.forEach(t => status[t] = 'pending');
    EVENTS.push({
      id: Date.now(),
      title,
      subtitle: modal.querySelector('#neSubtitle').value.trim(),
      date, time,
      location: modal.querySelector('#neLocation').value.trim(),
      deadline,
      teachers, entries: [], status
    });
    modal.remove();
    toast('Veranstaltung angelegt!');
    render();
  });
  modal.querySelector('#closeNewEventBtn').addEventListener('click', () => modal.remove());
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
}

// Initial render
render();
</script>
