          </div>
          <p class="form-hint" id="tpEmpty" hidden>Keine Lehrkraft gefunden.</p>
        </div>`;
}
function bindEventFieldSuggest() {
  attachFieldSuggest(document.getElementById('neTitle'), 'title');
  attachFieldSuggest(document.getElementById('neSubtitle'), 'subtitle');
  attachFieldSuggest(document.getElementById('neLocation'), 'location');
}
function bindTeacherPicker() {
  const items = $$('.tp-item'), boxes = () => $$('.ne-teacher');
  const search = document.getElementById('tpSearch'), btnAll = document.getElementById('tpAll'), btnNone = document.getElementById('tpNone');
  if (!search) return;
  const visible = () => items.filter(i => !i.hidden);
  const updateCount = () => { document.getElementById('tpCount').textContent = `${boxes().filter(b => b.checked).length} von ${boxes().length} ausgewählt`; };
  const applyFilter = () => {
    const q = norm(search.value).trim();
    items.forEach(i => { i.hidden = !!q && !q.split(/\s+/).every(w => i.dataset.search.includes(w)); });
    document.getElementById('tpEmpty').hidden = visible().length > 0;
    btnAll.textContent = q ? 'Gefundene wählen' : 'Alle';
    btnNone.textContent = q ? 'Gefundene abwählen' : 'Keine';
  };
  search.addEventListener('input', applyFilter);
  btnAll.addEventListener('click', () => { visible().forEach(i => { i.querySelector('input').checked = true; }); updateCount(); });
  btnNone.addEventListener('click', () => { visible().forEach(i => { i.querySelector('input').checked = false; }); updateCount(); });
  boxes().forEach(b => b.addEventListener('change', updateCount));
  const copy = document.getElementById('tpCopy');
  if (copy) copy.addEventListener('change', () => {
    const ev = EVENTS.find(e => String(e.id) === copy.value);
    if (!ev) return;
    search.value = ''; applyFilter();
    boxes().forEach(b => { b.checked = ev.teachers.includes(b.value); });
    updateCount();
  });
  updateCount();
}

/* ---------- Admin: Veranstaltung bearbeiten / löschen ---------- */
const isoFromDe = d => { const m = (d || '').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : ''; };
const deFromIso = v => v ? v.split('-').reverse().join('.') : '';
function renderEditEventPage() {
  const ev = EVENTS.find(e => e.id === selectedEvent);
  return `
    ${pageHead('Veranstaltung bearbeiten', esc(ev.title))}
    <div class="entry-section">
      <div class="form-grid">
        <div class="form-group full"><label for="neTitle">Titel *</label><input type="text" id="neTitle" value="${esc(ev.title)}"></div>
        <div class="form-group full"><label for="neSubtitle">Untertitel (optional)</label><input type="text" id="neSubtitle" value="${esc(ev.subtitle || '')}"></div>
        <div class="form-group"><label for="neDate">Datum</label><input type="date" id="neDate" value="${isoFromDe(ev.date)}"></div>
        <div class="form-group"><label for="neTime">Uhrzeit</label><input type="time" id="neTime" value="${esc((ev.time || '').replace(/\s*Uhr\s*$/, ''))}"></div>
        <div class="form-group full"><label for="neLocation">Ort</label><input type="text" id="neLocation" value="${esc(ev.location || '')}"></div>
        <div class="form-group"><label for="neDeadline">Abgabefrist</label><input type="date" id="neDeadline" value="${isoFromDe(ev.deadline)}"></div>
        ${teacherPickerHtml(new Set(ev.teachers), ev.id)}
      </div>
      <div class="page-actions">
        <button class="btn btn-danger" id="deleteEventBtn" type="button" style="margin-right:auto">Veranstaltung löschen</button>
        <button class="btn btn-secondary" id="cancelEditEventBtn" type="button">Abbrechen</button>
        <button class="btn btn-primary" id="saveEventBtn" type="button">Änderungen speichern</button>
      </div>
    </div>`;
}
function bindEditEventPage() {
  const save = document.getElementById('saveEventBtn');
  if (!save) return;
  bindTeacherPicker();
  bindEventFieldSuggest();
  document.getElementById('cancelEditEventBtn').addEventListener('click', () => go(parentPath()));
  save.addEventListener('click', () => {
    const ev = EVENTS.find(e => e.id === selectedEvent); if (!ev) return;
    const title = document.getElementById('neTitle').value.trim();
    if (!title) { toast('Bitte Titel eingeben.'); return; }
    const teachers = $$('.ne-teacher:checked').map(cb => cb.value);
    if (!teachers.length) { toast('Bitte mindestens eine Lehrkraft auswählen.'); return; }
    const removed = ev.teachers.filter(n => !teachers.includes(n));
    const withEntries = removed.filter(n => ev.entries.some(e => e.teacher === n));
    if (withEntries.length && !confirm(`${withEntries.join(', ')} ${withEntries.length > 1 ? 'haben' : 'hat'} schon Beiträge in dieser Veranstaltung. Die Beiträge bleiben im Programm, die Lehrkraft kann sie aber nicht mehr sehen. Trotzdem entfernen?`)) return;
    const t = document.getElementById('neTime').value;
    ev.title = title;
    ev.subtitle = document.getElementById('neSubtitle').value.trim();
    ev.date = deFromIso(document.getElementById('neDate').value);
    ev.time = t ? t + ' Uhr' : '';
    ev.location = document.getElementById('neLocation').value.trim();
    ev.deadline = deFromIso(document.getElementById('neDeadline').value);
    const status = {};
    teachers.forEach(n => { status[n] = ev.status[n] || 'pending'; });
    ev.teachers = teachers; ev.status = status;
    toast('Veranstaltung gespeichert');
    go(eventPath(ev.id), true);
  });
  document.getElementById('deleteEventBtn').addEventListener('click', () => {
    const ev = EVENTS.find(e => e.id === selectedEvent); if (!ev) return;
    const n = ev.entries.length;
    if (!confirm(`„${ev.title}“ wirklich löschen?` + (n ? `\n\nDabei werden auch alle ${n} Beiträge gelöscht. Das kann nicht rückgängig gemacht werden.` : ''))) return;
    EVENTS.splice(EVENTS.indexOf(ev), 1);
    toast('Veranstaltung gelöscht');
    go('/admin', true);
  });
}

        </div>`).join('')}</div>`).join('') || '<p class="form-hint">Es wurde nichts erkannt.</p>'}
      <div class="page-actions">
        <button type="button" class="btn btn-secondary" id="impCancel">Verwerfen</button>

}
function bindListsExtras() {
  const addBox = document.getElementById('lsAddBox'), impBox = document.getElementById('lsImpBox');
  if (addBox) addBox.addEventListener('toggle', () => { LISTS.openAdd = addBox.open; });
  if (impBox) impBox.addEventListener('toggle', () => { LISTS.openImp = impBox.open; });
  const addBtn = document.getElementById('lsAddBtn');
  if (addBtn) addBtn.addEventListener('click', async () => {
    const value = document.getElementById('lsNewValue').value.trim();
    const extraEl = document.getElementById('lsNewExtra'), scopeEl = document.getElementById('lsNewScope');
    if (!value) { toast('Bitte einen Wert eingeben.'); document.getElementById('lsNewValue').focus(); return; }
    if (LISTS.field === 'performer' && !scopeEl.value) { toast('Bitte die Klasse (Lehrkraft) wählen.'); return; }
    try {
      await api('/api/suggestions/add', { method: 'POST', body: { items: [{ field: LISTS.field, value, extra: extraEl ? extraEl.value.trim() : '', scope: scopeEl ? scopeEl.value : '' }] } });
      LISTS.openAdd = true; await listsReload(); toast('Angelegt'); renderOnly();
    } catch (e) { toast('Fehlgeschlagen: ' + e.message); }
  });
  const file = document.getElementById('lsFile');
  if (file) file.addEventListener('change', async () => {
    const f = file.files[0]; if (!f) return;
    LISTS.imp = { busy: true, name: f.name }; LISTS.openImp = true; renderOnly();
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await api('/api/suggestions/import', { method: 'POST', body: fd });
      LISTS.imp = { items: r.items.map(it => ({ ...it, on: !it.exists && !it.uncertain && (it.field !== 'performer' || !!it.scope) })), name: f.name };
    } catch (e) { LISTS.imp = { err: e.message }; }
    renderOnly();
  });
  if (LISTS.imp && LISTS.imp.items) {
    const imp = LISTS.imp;
    const refreshApply = () => {
      const n = imp.items.filter(i => i.on).length, b = document.getElementById('impApply');
      b.disabled = !n; b.textContent = `${n} Einträge übernehmen`;
    };
    $$('.ls-imp-row').forEach(row => {
      const it = imp.items[+row.dataset.i];
      row.querySelector('.imp-on').addEventListener('change', e => { it.on = e.target.checked; refreshApply(); });
      row.querySelector('.imp-value').addEventListener('change', e => { it.value = e.target.value.trim(); });
      const ex = row.querySelector('.imp-extra'); if (ex) ex.addEventListener('change', e => { it.extra = e.target.value.trim(); });
      const sc = row.querySelector('.imp-scope'); if (sc) sc.addEventListener('change', e => { it.scope = e.target.value; if (it.scope && !it.exists) { it.on = true; row.querySelector('.imp-on').checked = true; refreshApply(); } });
    });
    document.getElementById('impCancel').addEventListener('click', () => { LISTS.imp = null; renderOnly(); });
    document.getElementById('impApply').addEventListener('click', async () => {
      const sel = imp.items.filter(i => i.on && i.value);
      const missing = sel.find(i => i.field === 'performer' && !i.scope);
      if (missing) { toast(`Für „${missing.value}“ bitte die Klasse wählen.`); return; }
      try {
        const r = await api('/api/suggestions/add', { method: 'POST', body: { items: sel.map(({ field, value, extra, scope }) => ({ field, value, extra, scope })) } });
        LISTS.imp = null; await listsReload(); toast(`${r.added} Einträge übernommen`);
      } catch (e) { toast('Fehlgeschlagen: ' + e.message); }
      renderOnly();
    });
  }
}
async function listsReload() {
  const r = await api('/api/suggestions');
  LISTS.items = r.items;
  LISTS.sel = new Set([...LISTS.sel].filter(v => r.items.some(i => i.field === LISTS.field && i.value === v)));
  try { await loadState(); } catch (e) { /* Listen in den Formularen aktualisieren sich beim nächsten Laden */ }
}
async function listsApply(method, body, msg) {
  try {
    const r = await api('/api/suggestions', { method, body: { field: LISTS.field, replaceInData: LISTS.replace, ...body } });
    LISTS.sel.clear();
    await listsReload();
    toast(msg + (r && r.replaced ? ` (${r.replaced} Beitrag/Beiträge angepasst)` : ''));
  } catch (e) { toast('Fehlgeschlagen: ' + e.message); }
  if (adminPage === 'lists') renderOnly();
}

// Bild im Browser verkleinern (spart Speicher, D1-Zeilenlimit)
function downscaleImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

  const app = document.getElementById('app');
  app.innerHTML = '<div class="login-screen"><p class="form-hint">Lädt…</p></div>';
  try {
    const pub = await api('/api/public', { noLogout: true });
    SETTINGS.passwordEnabled = pub.passwordEnabled;
  } catch (e) {
    app.innerHTML = `<div class="login-screen"><div class="login-card"><h2>Keine Verbindung</h2><p>${esc(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">Erneut versuchen</button></div></div>`;
    return;
  }
  if (AUTH.token && (AUTH.role === 'admin' || AUTH.role === 'teacher')) {
    try { await loadState(); } catch (e) { clearSession(); }
  }
  window.addEventListener('hashchange', handleRoute);
  handleRoute();
}
boot();

</script>
</body>
</html>
