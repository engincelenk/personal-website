<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Domain test</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;text-align:center}
  h1{font-size:2rem;margin:0 0 .5rem} p{margin:.25rem 0;color:#94a3b8} code{color:#38bdf8}
</style>
</head>
<body>
<main>
  <h1>✅ It works</h1>
  <p>Served from <code id="host"></code></p>
  <p>Protocol: <code id="proto"></code></p>
  <p>Loaded: <code id="time"></code></p>
</main>
<script>
  host.textContent = location.host;
  proto.textContent = location.protocol;
  time.textContent = new Date().toLocaleString();
</script>
</body>
</html>
